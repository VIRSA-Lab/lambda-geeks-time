<!-- countdown.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Countdown to Next Session</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 100px;
      background-color: #f8f9fa;
    }
    h1 {
      font-size: 2rem;
    }
    #countdown {
      font-size: 2.5rem;
      color: #007BFF;
    }
  </style>
</head>
<body>
  <h1>🚀 Countdown to next session</h1>
  <div id="countdown">Loading...</div>
  <script>
    // Function to get the next Friday at 11:00 AM EDT
    function getNextFridayEDT() {
      const now = new Date();
      
      // Create a date for this Friday at 11:00 AM EDT (15:00 UTC)
      const thisFriday = new Date();
      const dayOfWeek = now.getDay(); // 0 = Sunday, 5 = Friday
      const daysUntilFriday = (5 - dayOfWeek + 7) % 7;
      
      thisFriday.setDate(now.getDate() + daysUntilFriday);
      thisFriday.setUTCHours(15, 0, 0, 0); // 11:00 AM EDT = 15:00 UTC
      
      // If today is Friday and we haven't passed 11:00 AM EDT yet, use today
      if (dayOfWeek === 5 && now < thisFriday) {
        return thisFriday;
      }
      
      // Otherwise, get next Friday
      const nextFriday = new Date(thisFriday);
      nextFriday.setDate(thisFriday.getDate() + (daysUntilFriday === 0 ? 7 : 0));
      return nextFriday;
    }

    const targetDate = getNextFridayEDT();

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById("countdown").textContent = "🚀 It's time!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("countdown").textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
